<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="icon" href="Favicons/Gallery-32.png" sizes="32x32">
  <link rel="icon" href="Favicons/Gallery.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="Favicons/Gallery-180.png">
  <link rel="stylesheet" href="Gallery_utils/Gallery_styles.css">
</head>
<body>

<div class="page-wrap">
  <div class="main-container">

    <!-- ============ HEADER ============ -->
    <div class="header-row">
      <div class="header-accent-left"></div>
      <div class="header-body">
        <div class="header-title" id="header-title"><a href="index.html" style="color:inherit;text-decoration:none;">Gallery</a></div>
        <div class="header-date"  id="header-date"></div>
        <div class="header-time"  id="header-time"></div>
      </div>
      <div class="header-accent-right"></div>
    </div>

    <!-- ============ STATS BAR ============ -->
    <div class="stats-bar">
      <div class="stats-count">
        <span id="stats-count-label">— PHOTOS</span>
      </div>
      <div class="stats-label">
        <div class="controls" id="view-buttons">
          <button class="view-btn" data-view="slideshow">Slideshow</button>
          <button class="view-btn" data-view="thumbnails">Thumbnails</button>
          <button class="view-btn" data-view="feed">Feed</button>
        </div>
        <div class="controls" id="filter-buttons"></div>
        <div class="controls controls-secondary">
          <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
          <button class="refresh-btn" id="sort-btn">Newest First</button>
          <span class="last-updated" id="last-updated"></span>
        </div>
      </div>
      <div class="stats-accent"></div>
    </div>

    <!-- ============ PHOTOS ============ -->
    <div id="gallery-wrapper"></div>

    <!-- ============ FOOTER ============ -->
    <div class="footer-row">
      <div class="footer-yellow"></div>
      <div class="footer-body">
        <span class="footer-text"><a href="#" style="color:inherit;text-decoration:none;">Gallery</a> · Personal Use Only</span>
      </div>
      <div class="footer-red"></div>
      <div class="footer-blue"></div>
    </div>

  </div>
</div>

<!-- ============ VIEWER (Expanded / Full Screen) ============ -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="viewer-panel">
    <div class="viewer-bar">
      <div class="viewer-count" id="viewer-count"></div>
      <div class="controls">
        <button class="refresh-btn" data-act="prev" aria-label="Previous photo">← Prev</button>
        <button class="refresh-btn" data-act="next" aria-label="Next photo">Next →</button>
        <button class="refresh-btn" data-act="play" data-play-btn>Play</button>
        <button class="refresh-btn" data-act="fullscreen" id="viewer-fs">Full Screen</button>
        <button class="refresh-btn" data-act="close" aria-label="Close viewer">✕ Close</button>
      </div>
    </div>
    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-img" alt="">
      <div class="viewer-status" id="viewer-status" role="status" aria-live="polite"></div>
    </div>
    <div class="viewer-caption" id="viewer-caption"></div>
  </div>
</div>

<!-- ============================================================
     CONFIGURATION
     Photos are listed from the repo folder below via the GitHub
     API, so new photos only need to be pushed — no code changes.
     Titles, captions and tags go in Gallery_images/gallery.json —
     see Gallery_images/README.md for the format.
     ============================================================ -->
<script>
window.GALLERY_CONFIG = {
  title: "Gallery",
  owner: "WMShaughnessy",       // GitHub account that owns this repo
  repo: "Public",               // this repo
  branch: "main",               // branch GitHub Pages publishes
  imagesDir: "Gallery_images",  // photo folder (subfolders = albums)
  captionsFile: "gallery.json", // captions/tags file inside that folder
  cacheTTLMinutes: 15,          // how long the folder listing is cached
  defaultView: "slideshow",     // "slideshow", "thumbnails" or "feed"
  newestFirst: true,
  slideshowSeconds: 6,          // Play interval
};
</script>
<script src="Gallery_utils/Gallery_script.js"></script>
</body>
</html>
